# Veröffentlicht alle Pakete in der Version des Git-Tags (v1.2.3 → 1.2.3).
# Nur dieser Workflow veröffentlicht, nie ein lokaler Rechner, und nur Commits, die auf main liegen.
#
# Authentifizierung ohne langlebige Schlüssel:
# - nuget.org: Trusted Publishing, Richtlinie für dieses Repo und release.yml auf nuget.org
#   anlegen, Variable NUGET_USER (Environment release) = nuget.org-Benutzername.
# - npm: Trusted Publishing je Paket auf npmjs.com mit "Allow npm publish".
#   Neue Pakete stellt der Workflow per npm stage publish bereit (Secret NPM_STAGE_TOKEN),
#   online gehen sie nach Freigabe mit 2FA; danach Trusted Publisher einrichten.
#
# Actions sind auf den Commit gepinnt (Version als Kommentar); Dependabot schlägt Updates vor.
name: Release

on:
  push:
    tags: ['v*.*.*']

# Ohne Rechte als Vorgabe; jeder Job nennt, was er braucht. id-token (OIDC) nur zum Veröffentlichen.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Volle Historie: Der Checkout holt dann alle Branches, also auch origin/main für merge-base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Ein Tag auf einem Commit außerhalb von main (etwa auf einem Feature-Branch) bricht hier ab,
      # bevor nuget und npm starten.
      - name: Tag liegt auf main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) liegt nicht auf main. Veröffentlicht wird nur von main."
            exit 1
          fi
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME ist keine SemVer-Version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  nuget:
    needs: version
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
      - run: dotnet test --solution Bfs.Seed.slnx --configuration Release
      - run: dotnet pack --configuration Release --output ../artifacts/nuget -p:Version="$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      # Das Zeitlimit gilt für den ganzen Befehl, alle Pakete samt Symbolen. Der Standard (300 s)
      # reichte nicht, nuget.org brauchte über zwei Minuten je Paket. Der Schlüssel
      # aus NuGet/login gilt eine Stunde; 45 Minuten bleiben darunter. Er kommt über env,
      # nicht als Ausdruck im Skript.
      - run: >
          dotnet nuget push "../artifacts/nuget/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
          --timeout 2700
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}

  npm:
    needs: version
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Version und Abhängigkeiten der Pakete untereinander (im Repo 0.0.0-dev), etwa die
      # Peer-Abhängigkeit von seed-web-people auf seed-web-auth. npm version passt diese nicht an.
      - run: node scripts/set-version.mjs "$VERSION"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - run: npm run build
      - run: npm test
      # npm stage gibt es ab npm 11.17; die Version ist fest, damit der Ablauf reproduzierbar bleibt.
      - run: npm install -g npm@11.17.0
      # Bestehende Pakete: npm publish per Trusted Publishing (OIDC).
      # Neue Pakete: npm stage publish mit dem Secret NPM_STAGE_TOKEN (Berechtigung "stage only");
      # online gehen sie erst nach Freigabe mit 2FA (npm stage approve oder npmjs.com).
      - name: npm publish
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          set -euo pipefail
          failed=()
          for manifest in packages/*/package.json; do
            name="$(node -p "require('./$manifest').name")"
            version="$(node -p "require('./$manifest').version")"
            # Wiederholbar: bereits veröffentlichte Versionen überspringen.
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version ist schon veröffentlicht."
            elif npm view "$name" name >/dev/null 2>&1; then
              echo "$name: npm publish"
              npm publish -w "$name" --access public --provenance || failed+=("$name")
            elif [ -z "$NPM_STAGE_TOKEN" ]; then
              echo "::error::$name ist neu auf npm. Dafür braucht der Workflow das Secret NPM_STAGE_TOKEN (Granular Token, stage only)."
              failed+=("$name")
            else
              echo "::notice::$name ist neu und wird per npm stage publish bereitgestellt. Freigabe: npm stage list, dann npm stage approve <id>."
              NODE_AUTH_TOKEN="$NPM_STAGE_TOKEN" npm stage publish -w "$name" --access public --provenance || failed+=("$name")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Nicht veröffentlicht: ${failed[*]}. Bei E404: Trusted Publisher des Pakets auf npmjs.com prüfen (Repo seed-packages, Workflow release.yml, Environment release, Allow npm publish)."
            exit 1
          fi
