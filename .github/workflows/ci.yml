name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nur lesen; Actions sind auf den Commit gepinnt (Version als Kommentar), Dependabot schlägt Updates vor.
permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: dotnet/global.json
      # Azurite für die Integrationstests von Bfs.Seed.Storage (ETag, Base64 der Queue).
      # Als Schritt statt als Service, weil der Service keine Startparameter kennt:
      # --skipApiVersionCheck, damit neuere Azure-SDKs nicht an der Emulator-Version scheitern.
      - name: Azurite
        run: >
          docker run -d --name azurite -p 10000:10000 -p 10001:10001 -p 10002:10002
          mcr.microsoft.com/azure-storage/azurite:3.37.0
          azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --inMemoryPersistence --skipApiVersionCheck
      - run: dotnet test --solution Bfs.Seed.slnx --configuration Release
        env:
          SEED_REQUIRE_AZURITE: 'true'
      - run: dotnet pack --configuration Release --output ../artifacts/nuget

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
